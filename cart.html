<script>

      link.classList.remove("text-gray-400");
      link.classList.add("text-yellow-500");
    }
  });
</script>

      Alpine.data('nav', () => ({

          this.$watch('open', value => {

          });
        }
      }));

  </script>
</header>




  <!-- Push content below navbar -->
  <div class="h-16"></div>

  <!-- Cart -->
  <main class="flex-1 container mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl shadow-xl p-5 sm:p-8">
      <h2 class="text-2xl font-bold mb-6 text-center text-pink-600" style="font-family:cursive;">🛒 Your Cart</h2>
      <div id="cartItems" class="space-y-4"></div>
    </div>
  </main>

  <!-- Desktop Checkout -->
  <div class="hidden md:flex justify-between items-center container mx-auto px-4 mt-4 mb-6" style="border-radius: 20px; border: 2px solid rgb(240, 74, 148); padding: 10px; background-color: white;">
    <p class="font-bold text-lg">Total: <span id="cartTotal">₹0</span></p>
    <a id="checkoutBtn" target="_blank"
       class="bg-pink-600 text-white px-6 py-3 rounded-xl hover:bg-pink-200 hover:text-black transition shadow-md">
      ✅ Checkout on WhatsApp
    </a>
  </div>

  <!-- Mobile Sticky Checkout -->
  <div class="md:hidden fixed bottom-16 left-0 right-0 bg-white/95 border-t shadow-lg p-4 flex justify-between items-center z-30" style="border-radius: 20px; border: 2px solid rgb(240, 74, 148);">
    <p class="font-bold text-lg">Total: <span id="cartTotalMobile">₹0</span></p>
    <a id="checkoutBtnMobile" target="_blank"
       class="bg-pink-500 text-white px-5 py-2 rounded-xl hover:bg-pink-600 transition shadow-md">
      ✅ Book Now
    </a>
  </div>


  <script>
  function loadCart() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let container = document.getElementById('cartItems');
    let total = 0;
    container.innerHTML = '';

    if (cart.length === 0) {
      container.innerHTML = '<p class="text-gray-500 text-center">Your cart is empty.</p>';
    }

    cart.forEach((item, i) => {
      // ✅ Fix: use item.title instead of item.name
      let subTotal = item.price * item.qty;
      total += subTotal;

      container.innerHTML += `
        <div class="bg-[#faf5f6] rounded-xl shadow-md p-4 flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">${item.name}</p>
            <p class="text-sm text-gray-500">₹${item.price} x ${item.qty} = <b>₹${subTotal}</b></p>
          </div>
          <div class="flex space-x-2 items-center">
            <button onclick="changeQty(${i},-1)" class="px-3 py-1 bg-gray-300 text-gray-800 rounded-lg">-</button>
            <span class="font-bold">${item.qty}</span>
            <button onclick="changeQty(${i},1)" class="px-3 py-1 bg-pink-500 text-white rounded-lg">+</button>
            <button onclick="removeItem(${i})" class="ml-2 px-3 py-1 bg-red-500 text-white rounded-lg">🗑</button>
          </div>
        </div>
      `;
    });

    // ✅ Update Total in both Desktop + Mobile
    document.getElementById('cartTotal').innerText = '₹' + total;
    if (document.getElementById('cartTotalMobile')) {
      document.getElementById('cartTotalMobile').innerText = '₹' + total;
    }

    // ✅ WhatsApp message
    let whatsappMsg = encodeURIComponent(
      'I want to book the following:\n' +
      cart.map(i => `${i.name} - ₹${i.price} x ${i.qty} = ₹${i.price * i.qty}`).join('\n') +
      `\n\nTotal: ₹${total}`
    );

    if (document.getElementById('checkoutBtn')) {
      document.getElementById('checkoutBtn').href = "https://wa.me/9389835280?text=" + whatsappMsg;
    }
    if (document.getElementById('checkoutBtnMobile')) {
      document.getElementById('checkoutBtnMobile').href = "https://wa.me/9389835280?text=" + whatsappMsg;
    }
  }

  function changeQty(i, delta) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart[i].qty += delta;
    if (cart[i].qty <= 0) {
      cart.splice(i, 1);
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  function removeItem(i) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(i, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  window.onload = loadCart;
</script>
