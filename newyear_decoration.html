<script>
  const heroSlides = document.querySelectorAll("#heroSlider .hero-slide");
  const heroSection = document.getElementById("heroSection");

  const heroBackgrounds = [
    "images/2.jpg",          // Book Now
    "images/christmas.jpg",  // Christmas
    "images/newyear.jpg"     // New Year
  ];

  let heroIndex = 0;
  let heroPaused = false;

  function changeHeroSlide() {
    if (heroPaused) return;

    heroSlides[heroIndex].classList.remove("active");
    heroSlides[heroIndex].classList.add("hidden");

    heroIndex = (heroIndex + 1) % heroSlides.length;

    heroSection.style.backgroundImage =
      `url('${heroBackgrounds[heroIndex]}')`;

    heroSlides[heroIndex].classList.remove("hidden");
    heroSlides[heroIndex].classList.add("active");
  }

  setInterval(changeHeroSlide, 3000);

  /* ───── Pause on press & hold ───── */

  // Desktop
  heroSection.addEventListener("mousedown", () => heroPaused = true);
  heroSection.addEventListener("mouseup", () => heroPaused = false);
  heroSection.addEventListener("mouseleave", () => heroPaused = false);

  // Mobile (touch)
  heroSection.addEventListener("touchstart", () => heroPaused = true);
  heroSection.addEventListener("touchend", () => heroPaused = false);
</script>
